version: "3.9"

services:
  expo:
    image: node:20.19.4-bullseye
    working_dir: /app
    volumes:
      - ./myakashic-app:/app
      - expo_node_modules:/app/node_modules
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
      - "19006:19006"
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - EXPO_USE_FAST_RESOLVER=1
    command: sh -c "npm install && npm run start -- --host 0.0.0.0"

volumes:
  expo_node_modules:
